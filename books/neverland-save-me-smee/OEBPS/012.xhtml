    <p class="no-indent">
      <span class="font-12">
        <span id="w357">"Crackers!</span>
      </span>
      <span class="font-11">
        <span id="w358">Hook</span>
        <span id="w359">and</span>
        <span id="w360">Smee</span>
        <span id="w361">are</span>
        <span id="w362">going</span>
        <span id="w363">across</span>
        <span id="w364">that</span>
        <br/>
        <span id="w365">narrow</span>
        <span id="w366">pass,&#8221;</span>
        <span id="w367">says</span>
        <span id="w368">Skully.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-11">
        <span id="w369">&#8220;Be</span>
        <span id="w370">ready</span>
        <span id="w371">to</span>
        <span id="w372">lend</span>
        <span id="w373">a</span>
        <span id="w374">hand,</span>
        <span id="w375">crew,&#8221;</span>
        <span id="w376">says</span>
        <span id="w377">Jake.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-11">
        <span id="w378">&#8220;See,</span>
        <span id="w379">Smee?</span>
        <span id="w380">This</span>
        <span id="w381">is</span>
        <span id="w382">a</span>
        <span id="w383">breeze,&#8221;</span>
        <span id="w384">says</span>
        <span id="w385">Captain</span>
        <span id="w386">Hook.</span>
        <span id="w387">&#8220;I</span>
        <span id="w388">don&#8217;t</span>
        <br/>
        <span id="w389">even</span>
        <span id="w390">know</span>
        <span id="w391">why</span>
        <span id="w392">they</span>
        <span id="w393">call</span>
        <span id="w394">it</span>
        <span id="w395">Crumble</span>
        <span id="w396">Canyon.&#8221;</span>
      </span>
    </p>
