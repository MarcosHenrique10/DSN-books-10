      <span class="font-11">
        <span id="w774">&#8220;Look</span>
        <span id="w775">alive,&#8221;</span>

        <span id="w777">Hook.</span>
        <span id="w778">&#8220;There</span>

    <p class="no-indent">

        <span id="w784">the</span>
        <span id="w785">spot,&#8221;</span>

    <p class="no-indent">
      <span class="font-11">
        <span id="w788">It&#8217;s</span>
        <span id="w789">Captain</span>
        <span id="w790">Cuddly!</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-11">
        <span id="w791">&#8220;Oh,</span>
        <span id="w792">my</span>
        <span id="w793">little</span>
        <span id="w794">cuddly</span>
        <span id="w795">wuddly!</span>
        <span id="w796">You</span>
        <span id="w797">are</span>
        <span id="w798">the</span>
        <span id="w799">greatest</span>
        <span id="w800">treasure</span>
        <br/>

        <span id="w802">all</span>
        <span id="w803">of</span>
        <span id="w804">Never</span>
        <span id="w805">Land.</span>
        <span id="w806">Yes,</span>
        <span id="w807">you</span>
        <span id="w808">are,&#8221;</span>
