  <div class="text-frame" style="left:114px; top:42px; width:582px; height:213px;">
    <p class="no-indent">
      <span class="font-11">
        <span id="w303">&#8220;Thank</span>
        <span id="w304">you,</span>
        <span id="w305">sea</span>
        <span id="w306">pups,&#8221;</span>
        <span id="w307">whispers</span>
        <span id="w308">Smee.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-11">
        <span id="w309">&#8220;See?</span>
        <span id="w310">That</span>
        <span id="w311">wasn&#8217;t</span>
        <span id="w312">dangerous</span>
        <span id="w313">at</span>
        <span id="w314">all,&#8221;</span>
        <span id="w315">says</span>
        <span id="w316">Hook</span>
        <span id="w317">as</span>
        <span id="w318">he</span>
        <span id="w319">staggers</span>
        <br/>
        <span id="w320">to</span>
        <span id="w321">the</span>
        <span id="w322">shore</span>
        <span id="w323">and</span>
        <span id="w324">falls</span>
        <span id="w325">down.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-11">
        <span id="w326">&#8220;Oh,</span>
        <span id="w327">my,&#8221;</span>
        <span id="w328">says</span>
        <span id="w329">Smee.</span>
        <span id="w330">&#8220;What</span>
        <span id="w331">do</span>
        <span id="w332">you</span>
        <span id="w333">say</span>
        <span id="w334">we</span>
        <span id="w335">go</span>
        <span id="w336">back</span>
        <span id="w337">to</span>
        <span id="w338">the</span>
        <br/>
        <span id="w339">Jolly</span>
        <span id="w340">Roger</span>
        <span id="w341">now,</span>
        <span id="w342">Cap&#8217;n?</span>
        <span id="w343">I&#8217;ll</span>
        <span id="w344">make</span>
        <span id="w345">you</span>
        <span id="w346">a</span>
        <span id="w347">nice</span>
        <span id="w348">cup</span>
        <span id="w349">of</span>
        <span id="w350">tea.&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-11">
        <span id="w351">&#8220;Never!&#8221;</span>
        <span id="w352">says</span>
        <span id="w353">Hook.</span>
        <span id="w354">&#8220;Crumble</span>
        <span id="w355">Canyon</span>
        <span id="w356">awaits!&#8221;</span>
      </span>
    </p>
