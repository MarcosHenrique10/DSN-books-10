    <p>
      <span class="font-9">
        <span id="w1027">Candace</span>
        <span id="w1028">jumped</span>
        <span id="w1029">out</span>
        <span id="w1030">of</span>
        <span id="w1031">the</span>
        <span id="w1032">machine.</span>
        <br/>
        <span id="w1033">She</span>
        <span id="w1034">started</span>
        <span id="w1035">to</span>
        <span id="w1036">bash</span>
        <span id="w1037">it</span>
        <span id="w1038">with</span>
        <span id="w1039">a</span>
        <span id="w1040">pipe.</span>
        <span id="w1041">Soon</span>
        <br/>
        <span id="w1042">the</span>
        <span id="w1043">machine</span>
        <span id="w1044">was</span>
        <span id="w1045">in</span>
        <span id="w1046">pieces!</span>
      </span>
    </p>
    <p>
      <span class="font-9">
        <span id="w1047">&#8220;Phineas</span>
        <span id="w1048">and</span>
        <span id="w1049">Ferb,</span>
        <span id="w1050">why</span>
        <span id="w1051">do</span>
        <span id="w1052">you</span>
        <br/>
        <span id="w1053">always</span>
        <span id="w1054">build</span>
        <span id="w1055">these</span>
        <span id="w1056">things?&#8221;</span>
        <span id="w1057">Candace</span>
        <br/>
        <span id="w1058">yelled.</span>
        <span id="w1059">&#8220;It&#8217;s</span>
        <span id="w1060">impossible</span>
        <span id="w1061">to</span>
        <span id="w1062">bust</span>
        <span id="w1063">you</span>
        <span id="w1064">for</span>
        <br/>
        <span id="w1065">everything!</span>
        <span id="w1066">It&#8217;s</span>
        <span id="w1067">not</span>
        <span id="w1068">my</span>
        <span id="w1069">job!&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-9">
        <span id="w1070">&#8220;Candace!&#8221;</span>
        <span id="w1071">Mandy</span>
        <span id="w1072">cheered.</span>
        <span id="w1073">&#8220;You</span>
        <br/>
        <span id="w1074">had</span>
        <span id="w1075">your</span>
        <span id="w1076">breakthrough!&#8221;</span>
      </span>
    </p>
