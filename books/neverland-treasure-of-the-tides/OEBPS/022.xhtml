    <p class="no-indent">
      <span class="font-5">
        <span id="w668">&#8220;Here&#8217;s</span>
        <span id="w669">Hidden</span>
        <span id="w670">Cove,&#8221;</span>
        <span id="w671">says</span>
        <span id="w672">Hook.</span>
        <span id="w673">&#8220;But</span>
        <span id="w674">where&#8217;s</span>
        <span id="w675">me</span>
        <span id="w676">treasure?&#8221;</span>
      </span>
    </p>
    <p class="no-indent p-spacer">
      <span class="font-5">
        <span id="w677">&#8220;That</span>
        <span id="w678">lovely</span>
        <span id="w679">little</span>
        <span id="w680">mermaid</span>
        <span id="w681">said,</span>
        <span id="w682">&#8216;All</span>
        <span id="w683">will</span>
        <span id="w684">be</span>
        <span id="w685">revealed</span>
        <span id="w686">at</span>
        <span id="w687">the</span>
        <br/>
        <span id="w688">turn</span>
        <span id="w689">of</span>
        <span id="w690">the</span>
        <span id="w691">tide,&#8217;&#8221;</span>
        <span id="w692">says</span>
        <span id="w693">Smee.</span>
      </span>
    </p>
  </div>
  <div class="text-frame" style="left:97px; top:605px; width:602px; height:76px;">
    <p class="no-indent">
      <span class="font-5">
        <span id="w694">Suddenly,</span>
        <span id="w695">a</span>
        <span id="w696">golden</span>
        <span id="w697">throne</span>
        <span id="w698">rises</span>
        <span id="w699">out</span>
        <span id="w700">of</span>
        <span id="w701">the</span>
        <span id="w702">water.</span>
      </span>
    </p>
    <p class="no-indent p-spacer">
      <span class="font-5">
        <span id="w703">&#8220;The</span>
        <span id="w704">Treasure</span>
        <span id="w705">of</span>
        <span id="w706">the</span>
        <span id="w707">Tides</span>
        <span id="w708">is</span>
        <span id="w709">a</span>
        <span id="w710">golden</span>
        <span id="w711">throne!</span>
        <br/>
        <span id="w712">And</span>
        <span id="w713">it&#8217;s</span>
        <span id="w714">all</span>
        <span id="w715">mine!&#8221;</span>
        <span id="w716">says</span>
        <span id="w717">Hook.</span>
      </span>
    </p>
