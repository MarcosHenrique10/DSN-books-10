        <span id="w334">"Crackers!"</span>

        <span id="w336">Skully.</span>
        <span id="w337">&#8220;That</span>
        <span id="w338">monkey</span>

        <span id="w341">harmonica!&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w342">&#8220;Mr.</span>
        <span id="w343">Monkey,</span>

        <span id="w345">I</span>
        <span id="w346">have</span>
        <span id="w347">my</span>

    <p class="no-indent">
