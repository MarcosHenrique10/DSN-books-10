    <p class="no-indent">
      <span class="font-22">
        <span id="w386">&#8220;Row</span>
        <span id="w387">faster,</span>
        <span id="w388">Smee!&#8221;</span>
        <span id="w389">yells</span>
        <span id="w390">Hook.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-22">
        <span id="w391">&#8220;But</span>
        <span id="w392">the</span>
        <span id="w393">rowboat</span>
        <span id="w394">is</span>
        <span id="w395">too</span>
        <span id="w396">heavy,&#8221;</span>
        <span id="w397">Smee</span>
        <span id="w398">says.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-22">
        <span id="w399">&#8220;Toss</span>
        <span id="w400">everything</span>
        <span id="w401">out,&#8221;</span>
        <span id="w402">Hook</span>
        <span id="w403">says.</span>
        <br/>
        <span id="w404">&#8220;Right</span>
        <span id="w405">away,</span>
        <span id="w406">Cap&#8217;n!&#8221;</span>
        <span id="w407">says</span>
        <span id="w408">Smee.</span>
      </span>
    </p>
