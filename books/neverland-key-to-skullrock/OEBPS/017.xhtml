      <span class="font-23">
        <span id="w304">Soon,</span>
        <span id="w305">the</span>
        <span id="w306">Jolly</span>
        <span id="w307">Roger</span>
        <span id="w308">comes</span>
        <span id="w309">to</span>
        <span id="w310">the</span>
        <span id="w311">Twin</span>
        <span id="w312">Tunnels.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-23">
        <span id="w313">&#8220;Which</span>
        <span id="w314">tunnel</span>
        <span id="w315">should</span>
        <span id="w316">we</span>
        <span id="w317">take,</span>
        <br/>
        <span id="w318">Cap&#8217;n?&#8221;</span>
        <span id="w319">Smee</span>
        <span id="w320">asks.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-23">
        <span id="w321">&#8220;Just</span>
        <span id="w322">take</span>
        <span id="w323">the</span>
        <span id="w324">small</span>
        <span id="w325">one,&#8221;</span>
        <span id="w326">Hook</span>
        <span id="w327">says.</span>
