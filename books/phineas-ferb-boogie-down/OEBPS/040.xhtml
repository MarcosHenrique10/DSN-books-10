    <p class="indent">
      <span class="font-20">
        <span id="w1096">Dr.</span>
        <span id="w1097">Doofenshmirtz</span>
        <span id="w1098">was</span>
        <span id="w1099">getting</span>
        <br/>
        <span id="w1100">desperate.</span>
        <span id="w1101">He</span>
        <span id="w1102">started</span>
        <span id="w1103">pushing</span>
        <span id="w1104">dancers</span>
        <br/>
        <span id="w1105">out</span>
        <span id="w1106">of</span>
        <span id="w1107">their</span>
        <span id="w1108">spotlights.</span>
        <span id="w1109">But</span>
        <span id="w1110">Rodney</span>
        <br/>
        <span id="w1111">had</span>
        <span id="w1112">the</span>
        <span id="w1113">same</span>
        <span id="w1114">idea.</span>
      </span>
    </p>
    <p class="indent">
      <span class="font-20">
        <span id="w1115">&#8220;If</span>
        <span id="w1116">anyone&#8217;s</span>
        <span id="w1117">pushing</span>
        <span id="w1118">this</span>
        <span id="w1119">dancer</span>
        <span id="w1120">out</span>
        <br/>
        <span id="w1121">of</span>
        <span id="w1122">the</span>
        <span id="w1123">way,</span>
        <span id="w1124">it&#8217;s</span>
        <span id="w1125">me!&#8221;</span>
        <span id="w1126">Dr.</span>
        <span id="w1127">Doofenshmirtz</span>
        <span id="w1128">cried.</span>
      </span>
    </p>
    <p class="indent">
      <span class="font-20">
        <span id="w1129">&#8220;I</span>
        <span id="w1130">was</span>
        <span id="w1131">here</span>
        <span id="w1132">first!&#8221;</span>
        <span id="w1133">Rodney</span>

        <span id="w1135">back.</span>
      </span>
