  <div class="text-frame" style="left:99px; top:100px; width:542px; height:363px;">
    <p>
      <span class="font-9">
        <span id="w1429">Soon,</span>
        <span id="w1430">Phineas</span>
        <span id="w1431">and</span>
        <span id="w1432">Ferb</span>
        <span id="w1433">arrived</span>
        <span id="w1434">home.</span>
        <br/>
      </span>
      <span class="font-9">
        <span id="w1435">&#8220;Wait</span>
        <span id="w1436">until</span>
        <span id="w1437">you</span>
        <span id="w1438">hear</span>
        <span id="w1439">what</span>
        <span id="w1440">we</span>
        <span id="w1441">did</span>
        <span id="w1442">today,&#8221;</span>
        <br/>
      </span>
      <span class="font-9">
        <span id="w1443">Phineas</span>
        <span id="w1444">said.</span>
      </span>
    </p>
    <p>
      <span class="font-9">
        <span id="w1445">&#8220;I</span>
        <span id="w1446">have</span>
        <span id="w1447">something</span>
        <span id="w1448">to</span>
        <span id="w1449">tell</span>
        <span id="w1450">you</span>
        <span id="w1451">first,&#8221;</span>
        <br/>
        <span id="w1452">Baljeet</span>
        <span id="w1453">said</span>
        <span id="w1454">sadly.</span>
      </span>
    </p>
    <p>
      <span class="font-9">
        <span id="w1455">Just</span>
        <span id="w1456">then,</span>
        <span id="w1457">Perry</span>
        <span id="w1458">walked</span>
        <span id="w1459">by.</span>
        <span id="w1460">Baljeet</span>
        <br/>
        <span id="w1461">couldn&#8217;t</span>
        <span id="w1462">believe</span>
        <span id="w1463">his</span>
        <span id="w1464">eyes!</span>
      </span>
    </p>
    <p>
      <span class="font-9">
        <span id="w1465">	&#8220;Thanks,</span>
        <span id="w1466">Baljeet,&#8221;</span>
        <span id="w1467">Phineas</span>
        <span id="w1468">said,</span>
        <br/>
      </span>
      <span class="font-9">
        <span id="w1469">smiling.</span>
        <span id="w1470">&#8220;I</span>
        <span id="w1471">knew</span>
        <span id="w1472">we</span>
        <span id="w1473">could</span>
        <span id="w1474">count</span>
        <span id="w1475">on</span>
        <span id="w1476">you.&#8221;</span>
      </span>
    </p>
